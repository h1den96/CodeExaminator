x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: mrkushalsm/judge0:cgv2
    env_file: judge0.conf
    environment:
      - DB_HOST=db
      - DB_USER=judge0
      - DB_PASSWORD=judge0
      - DB_NAME=judge0
      - REDIS_HOST=redis
      - REDIS_PASSWORD=code_examinator_secure_redis_pass
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2358:2358"
    privileged: true
    <<: *default-logging
    restart: always

  workers:
    image: mrkushalsm/judge0:cgv2
    deploy:
      replicas: 2
    env_file: judge0.conf
    environment:
      - DB_HOST=db
      - DB_USER=judge0
      - DB_PASSWORD=judge0
      - DB_NAME=judge0
      - REDIS_HOST=redis
      - REDIS_PASSWORD=code_examinator_secure_redis_pass
    command: ["./scripts/workers"]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    ports:
      - "5433:5432"
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0
      - POSTGRES_DB=judge0

  redis:
    image: redis:7.2.4
    command: sh -c 'redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"'
    env_file: judge0.conf
    environment:
      - REDIS_PASSWORD=code_examinator_secure_redis_pass
    <<: *default-logging
    restart: always

volumes:
  data:
